# /etc/openvpn/client.conf
client
dev tun
proto tcp
remote 10.2.218.30 1194
auth-user-pass /etc/openvpn/credenciales.txt
auth SHA256
cipher AES-128-CBC
data-ciphers AES-128-CBC
# Fingerprint SHA256 del certificado del servidor, con separadores ":"
#   En MikroTik:  /certificate print detail where name=server
#   Formatear:    echo "<HEX>" | sed 's/../&:/g;s/:$//'
peer-fingerprint <FINGERPRINT_DEL_SERVIDOR>
resolv-retry infinite
persist-key
persist-tun
nobind
verb 3
